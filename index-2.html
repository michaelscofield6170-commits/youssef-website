<!DOCTYPE html>
<html>

<head>

    <title>DOM</title>
    <link rel="stylesheet" href="style-2.css">
</head>
<body>

    <p class="title">Rock Paper Scissors</p>

    <button onclick="
        
        PlayGame('rock')
        PickComputerMove();
        
     " class="move-button">
    <img src="images/rock-emoji.png" class="move-icon"> 
    </button>
    <button onclick="
        
        PlayGame('paper')
        PickComputerMove();
        
    " class="move-button">    
    <img src="images/paper-emoji.png" class="move-icon"> 
    </button>
    <button onclick="
        
        PlayGame('scissors')
        PickComputerMove();
        
    " class="move-button">
    <img src="images/scissors-emoji.png" class="move-icon">     
    </button>

    <p class="the-result"></p>
    <p class="the-choose"></p>
    <p class="js-score"></p>


    <button onclick="
    
    score.wins = 0 ;
    score.losses = 0;
    score.draws = 0 ;
    localStorage.removeItem('score');
    updateScore();
    
    " class="reset-btn">
        Reset Score
    </button>





</body>

<script src="javascript.js"></script>

</html>
